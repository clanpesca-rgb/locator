name: Report Instagram giornaliero

on:
  schedule:
    # Obiettivo: consegna entro le 8:30 italiane. GitHub esegue i cron in
    # ritardo anche di ore nelle fasce affollate (minuti :00 e :30), quindi:
    # - orario anticipato alle 04:47 UTC (06:47 italiane) per assorbire il ritardo
    # - minuto "dispari" (47) perché le fasce piene slittano di più
    - cron: "47 4 * * *"
  # Permette di lanciare il report a mano dal sito/app di GitHub:
  # tab Actions → Report Instagram giornaliero → Run workflow
  workflow_dispatch:
    inputs:
      mode:
        description: "report = genera e invia; check = solo diagnostica"
        type: choice
        default: report
        options:
          - report
          - check

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r instagram_report/requirements.txt

      - name: Genera e invia il report
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          EMAIL_MITTENTE: ${{ secrets.EMAIL_MITTENTE }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
        run: |
          if [ -z "$IG_TOKEN" ]; then
            echo "Secrets non ancora configurati: salto l'esecuzione."
            echo "Vai su Settings → Secrets and variables → Actions e aggiungi le chiavi."
            exit 0
          fi
          if [ "${{ inputs.mode }}" = "check" ]; then
            python instagram_report/daily_report.py --check
          else
            python instagram_report/daily_report.py
          fi
